# ==============================================================================
# 弓网AI监测算法包 (gongwang_monitor, algo_id=10008)
# ==============================================================================

hardware_config:
  train_id: "CR400BF"
  car_number: 6
  camera_id: 0

video_stream_config:
  decoder_backend: "gstreamer_nvdec"  # 可选: "gstreamer_nvdec", "ffmpeg"
  codec_type: "auto"                 # 可选: "auto" (自动探测), "h264", "h265"
  gstreamer_latency_ms: 0            # 极低延时模式设置为 0
  streams:
    - rtsp_url: "./弓网典型视频/dirty_1.mp4"
      camera_id: 0
      car_number: 6
      result_base_dir: "./local_cache/Algo-result"
      ftp_remote_dir: "nvme1/Algo-result"
  fps: 30
  img_size: 640
  ffmpeg_restart_delay: 5

base_algorithm_config:
  engine_type: "layered_detector"
  detectors_config: "config/detectors.yaml"

alarm_push_config:
  udp_ip: "127.0.0.1"
  udp_port: 8080
  spark_duration_ms: 700
  common_response_time_s: 3
  dirty_check_window_min: 3
  fault_levels:
    "大火花": 1
    "受电弓结构异常": 1
    "悬挂异物": 2
    "画面脏污": 2
    "受电弓倾斜": 2
    "异常飘弓": 2

phm_config:
  enabled: true
  host_addrs:
    - ["172.10.1.188", 33000]
    - ["127.0.0.1", 33000]
  monitor:
    algo_id: 10008
    algo_port: 39008
    app_config: "AppConfig.xlsx"
    output_interval_ms: 1000
    log_status: false
    log_output: false

ftp_config:
  enabled: true
  host: "172.10.1.2"
  port: 21
  username: "ftpuser"
  password: "Hirain123"
  passive: true
  timeout: 30
  cleanup_threshold: 0.80
  cleanup_target_ratio: 0.60
  max_storage_size_gb: 600.0
  clean_paths:
    - "nvme1/Algo-result"
  monitor_remote_dir: "nvme1/Algo-result"

log_config:
  enabled: false          # 开发机默认关闭文件日志，仅输出到控制台
  level: "DEBUG"          # 开发阶段使用 DEBUG 获取详细输出
  log_dir: ""
  max_bytes: 10485760
  backup_count: 3

  # 算法实时性能监控（每隔 report_interval_sec 秒在日志/控制台输出一次汇报）
  perf_monitor:
    enabled: true             # false 则完全关闭，零开销
    report_interval_sec: 5.0  # 开发测试时建议 5s 便于快速观察
    auto_export_report: true  # 自动生成/刷新 Markdown 和 JSON 性能评测大盘
    report_dir: "local_cache/reports" # 性能报告输出目录


# ==============================================================================
# 弓网AI监测算法包 (gongwang_monitor, algo_id=10008)
# ==============================================================================

hardware_config:
  train_id: "CR400BF"
  car_number: 6
  camera_id: 0

video_stream_config:
  streams:
    - rtsp_url: "rtsp://172.10.1.126/live/test"
      camera_id: 0
      car_number: 6
      result_base_dir: "/hirain/hi_opt/nvme1/Algo-result"
      ftp_remote_dir: "nvme1/Algo-result"
  fps: 30
  img_size: 640
  ffmpeg_restart_delay: 5

base_algorithm_config:
  engine_type: "tensorrt_qwen3_vl"
  model_name: "Qwen3-VL-4B-Instruct"
  trt_vision_engine: "./models/qwen3_vl_vision_fp16.engine"
  trt_llm_engine: "./models/qwen3_vl_llm_int4.engine"
  precision: "int4"
  roi_crop_size: [448, 448]
  enable_prefix_cache: true
  minified_json: true
  max_new_tokens: 24
  roi_coordinates: null
  conf_thresh: 0.25
  foreign_marker_window_seconds: 0.25


alarm_push_config:
  udp_ip: "192.168.106.200"
  udp_port: 8080
  spark_duration_ms: 700
  common_response_time_s: 3
  dirty_check_window_min: 3
  fault_levels:
    "大火花": 1
    "受电弓结构异常": 1
    "悬挂异物": 2
    "画面脏污": 2
    "受电弓倾斜": 2
    "异常飘弓": 2

phm_config:
  enabled: true
  host_addrs:
    - ["172.10.1.188", 33000]
    - ["127.0.0.1", 33000]
  monitor:
    algo_id: 10008
    algo_port: 39008
    app_config: "AppConfig.xlsx"
    output_interval_ms: 1000
    log_status: true
    log_output: true

ftp_config:
  enabled: true
  host: "172.10.1.2"
  port: 21
  username: "ftpuser"
  password: "Hirain123"
  passive: true
  timeout: 30
  cleanup_threshold: 0.80
  cleanup_target_ratio: 0.60
  max_storage_size_gb: 600.0
  clean_paths:
    - "nvme1/Algo-result"
  monitor_remote_dir: "nvme1/Algo-result"

log_config:
  enabled: true           # 总开关：true=同时写文件日志；false=仅控制台输出
  level: "INFO"           # 日志级别：DEBUG / INFO / WARNING / ERROR
  log_dir: ""             # 留空则自动选择路径（板卡: /hirain/hi_opt/algo_log/monitor，开发机: local_cache/logs/monitor）
  max_bytes: 10485760     # 单个日志文件上限（默认 10 MB）
  backup_count: 5         # 轮转保留备份数量

  # 算法实时性能监控（每隔 report_interval_sec 秒在日志中输出一次汇报）
  perf_monitor:
    enabled: true             # false 则完全关闭，零开销
    report_interval_sec: 10.0 # 汇报周期（秒），Jetson 测试建议 5~10s

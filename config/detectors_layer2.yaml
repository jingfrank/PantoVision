global:
  device: cuda:0
  fallback_device: cpu
  enable_shared_context: true
  prefer_tensorrt: true
detectors:
- name: spark
  type: YoloSparkDetector
  enabled: true
  schedule:
    mode: every_frame
    interval_frames: 1
    panto_gate: always
  params:
    model_path: models/best.pt
    engine_path: models/best.engine
    prefer_tensorrt: true
    conf_thresh: 0.3
    spark_area_ratio: 0.05
    spark_min_area: 400
    spark_duration_frames: 12
    require_panto_overlap: true
    panto_bbox_hold_sec: 1.0
- name: dirt
  type: FastadDirtDetector
  enabled: true
  schedule:
    mode: interval
    sample_interval_sec: 1.0
    phase_offset_sec: 0.0
    panto_gate: raised_only
  params:
    model_path: models/fastad_layer2_256_reg1e4_nq3_fmq1.pt
    engine_path: models/fastad_layer2_256.engine
    prefer_tensorrt: true
    use_gpu_preprocess: true
    grid_size: 64
    ema_decay: 0.85
    persistence_frames: 4
    min_active_cells: 6
    dirt_score_thresh: 2.0
    pixel_threshold: 4.5
- name: tilt
  type: HrnetTiltDetector
  enabled: true
  schedule:
    mode: interval
    sample_interval_sec: 1.0
    phase_offset_sec: 0.5
    panto_gate: raised_only
  params:
    weights_path: models/best_hrnet_w32_panto.pth
    engine_path: models/best_hrnet_w32_panto.engine
    prefer_tensorrt: true
    width: 32
    num_joints: 4
    target_size:
    - 288
    - 384
    heatmap_size:
    - 72
    - 96
    structural_warning_thresh: 5
    structural_alarm_thresh: 5
    consecutive_alarms: 3
- name: float
  type: YoloFloatDetector
  enabled: true
  schedule:
    mode: every_frame
    interval_frames: 1
    panto_gate: lowered_only
  params:
    window_size: 30
    float_speed_thresh: 200.0
    panto_down_height_limit: 70
    consecutive_alarm_frames: 5
- name: structural
  type: FastadStructDetector
  enabled: true
  schedule:
    mode: interval
    sample_interval_sec: 1.0
    phase_offset_sec: 0.0
    panto_gate: raised_only
  params:
    model_path: models/fastad_layer2_256_reg1e4_nq3_fmq1.pt
    engine_path: models/fastad_layer2_256.engine
    prefer_tensorrt: true
    use_gpu_preprocess: true
    min_defect_area: 250
    img_threshold: 8.5
    pantograph_roi_ratio:
    - 0.15
    - 0.15
    - 0.85
    - 0.7
- name: foreign_object
  type: FastadForeignDetector
  enabled: false
  schedule:
    mode: interval
    sample_interval_sec: 1.0
    phase_offset_sec: 0.0
    panto_gate: raised_only
  params:
    model_path: models/fastad_layer2_256_reg1e4_nq3_fmq1.pt
    engine_path: models/fastad_layer2_256.engine
    prefer_tensorrt: true
    use_gpu_preprocess: true
    catenary_roi_ratio:
    - 0.25
    - 0.25
    - 0.85
    - 0.5
    min_foreign_area: 100
    max_blobs_filter: 12
    foreign_score_threshold: 2.2

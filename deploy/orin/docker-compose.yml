version: '3.8'

services:
  gongwang_monitor:
    image: ghcr.io/nvidia-ai-iot/vllm:latest-jetson-orin 
    working_dir: /app
    container_name: gongwang_clean
    restart: always
    runtime: nvidia
    command: sleep infinity 
    network_mode: "host"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /usr/share/fonts:/usr/share/fonts:ro
      - /hirain/hi_opt/nvme1/Algo-result:/hirain/hi_opt/nvme1/Algo-result
      - /home/hirain/Desktop/gongwang_clean:/app
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

